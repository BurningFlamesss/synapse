name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pip install --no-binary pydantic pydantic
      - run: pip install --no-binary platformdirs platformdirs
      - run: pip install --no-binary tomli tomli
      - run: pip install click ddgs fastmcp httpx openai rich tiktoken
      - run: >
          pyinstaller --onefile --name synapse
          --collect-all pydantic
          --collect-all click
          --collect-all rich
          --collect-all httpx
          --collect-all openai
          --collect-all tiktoken
          --collect-all platformdirs
          --collect-all tomli
          --collect-all fastmcp
          --copy-metadata fastmcp
          --copy-metadata openai
          --copy-metadata httpx
          main.py
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to Artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ matrix.os }}
          path: dist/